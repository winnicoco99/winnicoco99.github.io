<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>新西兰南岛 · 12晚</title>
<meta name="description" content="2026.12.20–12.31 新西兰南岛自驾行程地图">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NZ 12晚">
<meta name="theme-color" content="#f5f5f7">
<link rel="manifest" href="manifest.json?v=6">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --bg-primary:    #ffffff;
  --bg-secondary:  #f2f2f7;
  --bg-tertiary:   #fbfbfd;
  --bg-grouped:    #f2f2f7;
  --bg-elevated:   #ffffff;
  --text-primary:  #1d1d1f;
  --text-secondary:#86868b;
  --text-tertiary: #aeaeb2;
  --accent:        #0071e3;
  --tint-red:      #ff3b30;
  --tint-orange:   #ff9500;
  --tint-green:    #34c759;
  --tint-blue:     #007aff;
  --tint-purple:   #af52de;
  --tint-teal:     #30b0c7;
  --separator:     rgba(60,60,67,.12);
  --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 14px rgba(0,0,0,.08);
  --shadow-lg: 0 8px 30px rgba(0,0,0,.12);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --safe-top: env(safe-area-inset-top, 0px);
  --topbar-h: calc(var(--safe-top) + 52px);
  --map-h: 34vh;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg-primary:#000; --bg-secondary:#000; --bg-tertiary:#1c1c1e;
    --bg-grouped:#1c1c1e; --bg-elevated:#1c1c1e;
    --text-primary:#f5f5f7; --text-secondary:#98989d; --text-tertiary:#6e6e73;
    --separator:rgba(84,84,88,.36); --accent:#0a84ff;
  }
  .card, .info-card, .route-bar, .pay-summary, .stay-card { background: var(--bg-elevated) !important; }
  .tabs { background: rgba(28,28,30,.82) !important; }
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { background: var(--bg-secondary); min-height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  padding-top: var(--topbar-h);
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  line-height: 1.47;
  letter-spacing: -0.018em;
  overscroll-behavior-y: none;
}
a { color: var(--accent); text-decoration: none; }

/* ── Top bar ── */
.topbar {
  position: fixed; top:0; left:0; right:0; z-index: 1200;
  padding: calc(var(--safe-top) + 8px) 16px 8px;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background: rgba(242,242,247,.78);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  border-bottom: .5px solid transparent;
  transition: border-color .3s;
}
.topbar.scrolled { border-bottom-color: var(--separator); }
.topbar .brand { display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700; letter-spacing:-.02em; }
.topbar .brand .flag { font-size:17px; }
.topbar .seg { display:flex; gap:4px; align-items:center; }
.countdown {
  font-size:11px; font-weight:700; padding:5px 10px; border-radius:980px;
  background: rgba(255,59,48,.1); color: var(--tint-red);
  font-variant-numeric: tabular-nums; white-space:nowrap;
}
.countdown.live { background: rgba(52,199,89,.14); color:#1f9d43; }

/* ── Map ── */
#map { width:100%; height: var(--map-h); min-height: 260px; }
.leaflet-container { background: #e9edf0; }
.map-wrap { position: sticky; top: var(--topbar-h); z-index:100; transition: none; }
body.map-full .map-wrap {
  position: fixed; top: var(--topbar-h); left:0; right:0;
  height: calc(100dvh - var(--topbar-h)); z-index: 1250;
  box-shadow: 0 18px 40px rgba(0,0,0,.22);
}
body.map-full #map { height: 100%; }
body.map-full .tabs { display: none; }
body.map-full .leaflet-bottom { bottom: calc(var(--safe-bottom) + 8px); }
.locate-btn, .fit-btn {
  width:36px; height:36px; border-radius:9px; background: rgba(255,255,255,.92);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  border:none; box-shadow: 0 1px 4px rgba(0,0,0,.18);
  display:flex; align-items:center; justify-content:center; font-size:16px;
  cursor:pointer; margin-bottom:6px;
}
@keyframes loc-pulse { 0%{transform:scale(1);opacity:.55} 100%{transform:scale(2.4);opacity:0} }
.loc-pulse { width:14px;height:14px;border-radius:50%;background:rgba(0,122,255,.25); animation: loc-pulse 1.6s ease-out infinite; }

/* ── Tabs ── */
.tabs {
  display:flex; gap:6px; padding: 10px 16px; overflow-x:auto;
  background: rgba(255,255,255,.88);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  position: sticky; top: calc(var(--topbar-h) + var(--map-h)); z-index:99;
  border-bottom:.5px solid var(--separator);
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar { display:none; }
.tab {
  flex-shrink:0; padding: 7px 14px; border-radius:980px; border:none;
  background: var(--bg-grouped); color: var(--text-secondary);
  font-size:13.5px; font-weight:600; cursor:pointer; white-space:nowrap;
  transition: all .22s ease; letter-spacing:-.01em;
  font-family: inherit;
}
.tab:active { transform: scale(.95); }
.tab.active { background: var(--text-primary); color: var(--bg-secondary); }
.tab.today::after { content:''; display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--tint-red); margin-left:5px; vertical-align:middle; }

/* ── Bottom nav ── */
.bnav {
  position: fixed; bottom:0; left:0; right:0; z-index:1100;
  display:flex; padding: 6px 6px calc(6px + var(--safe-bottom));
  background: rgba(255,255,255,.9);
  -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px);
  border-top:.5px solid var(--separator);
}
.bnav button {
  flex:1; border:none; background:none; padding:6px 2px 4px;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  color: var(--text-tertiary); font-size:10px; font-weight:600; cursor:pointer;
  font-family: inherit;
}
.bnav button svg { width:22px; height:22px; stroke: currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.bnav button.active { color: var(--text-primary); }

/* ── Content ── */
.content { max-width: 720px; margin:0 auto; padding: 16px 16px calc(96px + var(--safe-bottom)); }
.pane { display:none; }
.pane.active { display:block; animation: fade .28s ease; }
@keyframes fade { from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none} }

/* ── Hero ── */
.hero { padding: 20px 4px 22px; }
.hero .eyebrow { font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color: var(--tint-red); margin-bottom:10px; display:flex; align-items:center; gap:6px;}
.hero .eyebrow::before { content:''; width:18px; height:1.5px; background: currentColor; }
.hero h1 { font-size: 34px; font-weight:800; letter-spacing:-.035em; line-height:1.08; }
.hero .sub { font-size:16px; color: var(--text-secondary); margin-top:8px; line-height:1.5; }
.hero .sub strong { color: var(--text-primary); font-weight:600; }
.hero .meta { display:flex; gap:16px; margin-top:16px; flex-wrap:wrap; }
.hero .meta div { display:flex; flex-direction:column; gap:1px; }
.hero .meta .k { font-size:10.5px; color: var(--text-tertiary); font-weight:600; letter-spacing:.04em; text-transform:uppercase; }
.hero .meta .v { font-size:15px; font-weight:700; letter-spacing:-.02em; }

/* ── Day strip (calendar days) ── */
.daystrip { display:flex; gap:8px; overflow-x:auto; padding: 4px 0 14px; scrollbar-width:none; }
.daystrip::-webkit-scrollbar{display:none;}
.dchip {
  flex-shrink:0; width:60px; padding:10px 0 9px; border-radius:14px; border:none;
  background: var(--bg-elevated); box-shadow: var(--shadow-sm);
  display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer;
  font-family:inherit; color:var(--text-primary);
}
.dchip .d { font-size:19px; font-weight:800; letter-spacing:-.03em; line-height:1.1; }
.dchip .w { font-size:10px; color:var(--text-tertiary); font-weight:600; }
.dchip .c { width:6px; height:6px; border-radius:50%; margin-top:4px; }
.dchip.hot { background: var(--text-primary); color: var(--bg-secondary); }
.dchip.hot .w { color: rgba(255,255,255,.6); }
.dchip.now { outline: 2px solid var(--tint-red); outline-offset: -2px; }

/* ── Cards ── */
.info-grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:20px; }
.info-card { background: var(--bg-elevated); border-radius: var(--radius-lg); padding:14px 16px; box-shadow: var(--shadow-sm); }
.info-card .label { font-size:10.5px; font-weight:700; color:var(--text-tertiary); letter-spacing:.05em; text-transform:uppercase; margin-bottom:4px; }
.info-card .value { font-size:15px; font-weight:700; letter-spacing:-.02em; line-height:1.35; }
.info-card .sm { font-size:12px; color:var(--text-secondary); font-weight:500; margin-top:2px; }

.section-head {
  font-size:12px; font-weight:700; color:var(--text-tertiary);
  letter-spacing:.06em; text-transform:uppercase;
  padding: 22px 4px 10px; display:flex; justify-content:space-between; align-items:baseline;
}
.section-head .more { font-size:11.5px; text-transform:none; letter-spacing:0; color: var(--accent); font-weight:600; }

/* ── Day list ── */
.daylist { display:flex; flex-direction:column; gap:8px; }
.drow {
  display:flex; gap:12px; padding:13px 14px; background: var(--bg-elevated);
  border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
  cursor:pointer; align-items:flex-start; border:none; text-align:left; width:100%;
  font-family:inherit; color:inherit;
}
.drow:active { background: var(--bg-grouped); }
.drow .num {
  flex-shrink:0; width:34px; height:34px; border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:800; color:#fff; letter-spacing:-.02em;
}
.drow .body { flex:1; min-width:0; }
.drow .t { font-size:15px; font-weight:700; letter-spacing:-.02em; display:flex; align-items:center; gap:6px; }
.drow .m { font-size:12px; color:var(--text-secondary); margin-top:2px; line-height:1.4; }
.drow .arrow { color: var(--text-tertiary); font-size:16px; align-self:center; }
.pill-hot { font-size:9.5px; font-weight:800; padding:1px 6px; border-radius:4px; letter-spacing:.03em; background: rgba(255,59,48,.12); color: var(--tint-red); }

/* ── Day detail ── */
.day-head { padding: 6px 4px 16px; }
.day-head .ri { font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--text-tertiary); }
.day-head h2 { font-size:27px; font-weight:800; letter-spacing:-.03em; margin-top:4px; line-height:1.15; }
.day-head .dd { font-size:14px; color:var(--text-secondary); margin-top:4px; }
.day-head .sum { font-size:15px; margin-top:12px; line-height:1.5; }

.chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:14px; }
.chip {
  font-size:12px; font-weight:600; padding:6px 11px; border-radius:9px;
  background: var(--bg-elevated); color: var(--text-secondary); box-shadow: var(--shadow-sm);
  display:flex; align-items:center; gap:5px;
}
.chip b { color: var(--text-primary); font-weight:700; }

/* ── Timeline ── */
.timeline { position:relative; padding-left: 62px; margin-top: 6px; }
.timeline::before { content:''; position:absolute; left: 47px; top: 18px; bottom: 26px; width:1.5px; background: var(--separator); }
.tl-item { position:relative; margin-bottom: 10px; }
.tl-time {
  position:absolute; left:-62px; top:15px; width:44px; text-align:right;
  font-size:11.5px; font-weight:700; color: var(--text-secondary);
  font-variant-numeric: tabular-nums; letter-spacing:-.01em;
}
.tl-dot {
  position:absolute; left:-19px; top:20px; width:9px; height:9px; border-radius:50%;
  z-index:1; box-shadow: 0 0 0 3.5px var(--bg-secondary);
}
.card {
  background: var(--bg-elevated); border-radius: var(--radius-md);
  padding: 13px 15px 12px; box-shadow: var(--shadow-sm);
}
.card .name { font-size:16.5px; font-weight:700; letter-spacing:-.02em; display:flex; align-items:center; gap:6px; line-height:1.3; }
.card .desc { font-size:13.5px; color: var(--text-secondary); line-height:1.5; margin-top:4px; }
.badge { display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
  width:18px; height:18px; border-radius:5px; font-size:10px; }
.badge.food { background: rgba(255,59,48,.1); color: var(--tint-red); }
.badge.spot { background: rgba(0,122,255,.1); color: var(--tint-blue); }
.badge.drink{ background: rgba(175,82,222,.1); color: var(--tint-purple); }
.badge.hotel{ background: rgba(255,149,0,.1); color: var(--tint-orange); }
.badge.transport { background: var(--bg-grouped); color: var(--text-secondary); }

.budget { display:inline-block; margin-top:7px; padding:3px 9px; background: var(--bg-grouped); border-radius:6px; font-size:11.5px; color:var(--text-secondary); font-weight:600; }
.links { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
.btn {
  display:inline-flex; align-items:center; gap:4px;
  padding: 7px 12px; border-radius:9px; font-size:12.5px; font-weight:700;
  border:none; cursor:pointer; font-family:inherit;
  text-decoration:none !important; transition: filter .18s, transform .1s;
  background: var(--bg-grouped); color: var(--text-primary);
}
.btn:active { filter: brightness(.93); transform: scale(.97); }
.btn.nav { background: var(--accent); color:#fff; }
.btn.nav2 { background: rgba(0,113,227,.1); color: var(--accent); }
.btn.xhs { background: #ff2442; color:#fff; }
.btn.dp { background: #ffa700; color:#fff; }
.btn.rsv { background: var(--tint-green); color:#fff; }
.details { margin-top:10px; padding-top:10px; border-top:.5px solid var(--separator); font-size:13px; color:var(--text-secondary); line-height:1.62; }
.details.closed { display:none; }

/* ── Stay cards ── */
.stay-card { background: var(--bg-elevated); border-radius: var(--radius-lg); padding:16px; box-shadow: var(--shadow-sm); margin-bottom:10px; }
.stay-card .top { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
.stay-card h3 { font-size:17px; font-weight:800; letter-spacing:-.02em; }
.stay-card .nights { font-size:12px; font-weight:700; color: var(--tint-orange); white-space:nowrap; }
.stay-card .area { font-size:12.5px; color:var(--text-secondary); margin-top:3px; }
.stay-card .why { font-size:13.5px; margin-top:10px; line-height:1.55; }
.stay-card .rows { margin-top:10px; display:flex; flex-direction:column; gap:5px; font-size:12.5px; color:var(--text-secondary); }
.stay-card .rows div { display:flex; gap:6px; }
.stay-card .rows b { color: var(--text-primary); font-weight:700; flex-shrink:0; }
.unbooked { display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:800; padding:2px 7px; border-radius:5px; background: rgba(255,149,0,.12); color:#c77700; letter-spacing:.02em; }

/* ── Bookings ── */
.bk-item { background: var(--bg-elevated); border-radius: var(--radius-md); padding:14px 15px; box-shadow: var(--shadow-sm); margin-bottom:8px; }
.bk-item .h { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
.bk-item .n { font-size:15px; font-weight:700; letter-spacing:-.02em; line-height:1.35; }
.bk-item .m { font-size:12px; color: var(--accent); font-weight:600; margin-top:3px; }
.bk-item .note { font-size:13px; color:var(--text-secondary); line-height:1.55; margin-top:8px; }
.status { font-size:10.5px; font-weight:800; padding:2px 7px; border-radius:5px; flex-shrink:0; white-space:nowrap; }
.status.todo { background: rgba(255,59,48,.1); color: var(--tint-red); }
.status.mid { background: rgba(255,149,0,.12); color:#c77700; }
.status.done { background: rgba(52,199,89,.12); color:#1f9d43; }
.urg-high { color: var(--tint-red); }

/* ── Checklist ── */
.ck-group { margin-bottom:14px; }
.ck-group h4 { font-size:13px; font-weight:700; color:var(--text-secondary); padding: 0 4px 8px; }
.ck-item {
  display:flex; gap:10px; align-items:flex-start; padding:11px 14px;
  background: var(--bg-elevated); box-shadow: var(--shadow-sm);
  font-size:14px; line-height:1.45; cursor:pointer; user-select:none;
}
.ck-item:first-of-type { border-radius: var(--radius-md) var(--radius-md) 0 0; }
.ck-item:last-of-type { border-radius: 0 0 var(--radius-md) var(--radius-md); }
.ck-item:only-of-type { border-radius: var(--radius-md); }
.ck-item + .ck-item { border-top:.5px solid var(--separator); }
.ck-box {
  flex-shrink:0; width:19px; height:19px; border-radius:50%; border:1.6px solid var(--text-tertiary);
  display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff;
  margin-top:1px;
}
.ck-item.on .ck-box { background: var(--tint-green); border-color: var(--tint-green); }
.ck-item.on .ck-txt { color: var(--text-tertiary); text-decoration: line-through; }

/* ── Budget ── */
.bd-top { display:flex; gap:10px; margin-bottom:14px; }
.bd-top > div { flex:1; background: var(--bg-elevated); border-radius: var(--radius-lg); padding:14px 16px; box-shadow: var(--shadow-sm); }
.bd-top .label { font-size:10.5px; font-weight:700; color:var(--text-tertiary); letter-spacing:.05em; text-transform:uppercase; }
.bd-top input {
  border:none; background:none; font-size:22px; font-weight:800; letter-spacing:-.03em;
  width:100%; font-family:inherit; color:var(--text-primary); outline:none;
  font-variant-numeric: tabular-nums; padding:2px 0 0;
}
.bd-top .unit { font-size:12px; color:var(--text-secondary); font-weight:600; }

.bd-row { background: var(--bg-elevated); border-radius: var(--radius-md); padding:13px 15px; box-shadow: var(--shadow-sm); margin-bottom:8px; }
.bd-row .h { display:flex; align-items:center; gap:9px; }
.bd-row .ic { width:26px; height:26px; border-radius:8px; background: var(--bg-grouped); display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
.bd-row .nm { font-size:15px; font-weight:700; letter-spacing:-.02em; flex:1; }
.bd-row .amt { display:flex; align-items:baseline; gap:4px; }
.bd-row .amt input {
  border:none; background:none; width:74px; text-align:right; font-size:15px; font-weight:700;
  font-family:inherit; color:var(--text-primary); outline:none; font-variant-numeric: tabular-nums;
  border-bottom:1px dashed var(--separator); padding:1px 2px;
}
.bd-row .amt input:focus { border-bottom-color: var(--accent); }
.bd-row .cur { font-size:11px; color:var(--text-tertiary); font-weight:600; }
.bd-row .note { font-size:11.5px; color:var(--text-tertiary); margin-top:5px; padding-left:35px; }
.bd-bar { height:5px; border-radius:3px; background: var(--bg-grouped); margin-top:9px; overflow:hidden; }
.bd-bar i { display:block; height:100%; border-radius:3px; transition: width .35s ease; }
.bd-bar i.over { background: var(--tint-red) !important; }
.bd-pct { font-size:11px; font-weight:700; color:var(--text-tertiary); }

.bd-total { background: var(--text-primary); color: var(--bg-secondary); border-radius: var(--radius-lg); padding:18px; margin: 16px 0 12px; }
.bd-total .big { font-size:32px; font-weight:800; letter-spacing:-.035em; font-variant-numeric: tabular-nums; line-height:1.1; }
.bd-total .cap { font-size:11.5px; font-weight:700; opacity:.6; letter-spacing:.05em; text-transform:uppercase; }
.bd-total .grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:14px; padding-top:14px; border-top:.5px solid rgba(255,255,255,.18); }
.bd-total .grid div .k { font-size:10px; opacity:.6; font-weight:700; letter-spacing:.04em; }
.bd-total .grid div .v { font-size:15px; font-weight:800; letter-spacing:-.02em; font-variant-numeric: tabular-nums; margin-top:1px; }

.share-box { background: var(--bg-elevated); border-radius: var(--radius-md); padding:13px 15px; box-shadow: var(--shadow-sm); margin-bottom:10px; }
.share-box .url {
  font-size:11px; color:var(--text-secondary); background: var(--bg-grouped);
  border-radius:8px; padding:9px 10px; margin:9px 0;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; line-height:1.45;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.banner {
  display:flex; align-items:center; gap:8px; padding:11px 14px; border-radius: var(--radius-md);
  font-size:13px; font-weight:600; margin-bottom:12px; line-height:1.45;
}
.banner.info { background: rgba(0,113,227,.08); color: var(--accent); }
.banner.warn { background: rgba(255,149,0,.1); color: #b37600; }
.banner button { margin-left:auto; border:none; background:none; color:inherit; font-weight:800; font-size:13px; font-family:inherit; cursor:pointer; white-space:nowrap; }

/* ── 记账面板 ── */
.sheet-mask { position:fixed; inset:0; background:rgba(0,0,0,.34); z-index:2000; opacity:0; pointer-events:none; transition:.22s;
  -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); }
.sheet-mask.on { opacity:1; pointer-events:auto; }
.sheet { position:fixed; left:0; right:0; bottom:0; z-index:2001; background:var(--bg-elevated);
  border-radius:20px 20px 0 0; padding:18px 20px calc(20px + var(--safe-bottom));
  transform:translateY(110%); transition:transform .32s cubic-bezier(.32,.72,0,1);
  max-height:88vh; overflow-y:auto; box-shadow:0 -8px 40px rgba(0,0,0,.18); }
.sheet.on { transform:translateY(0); }
.sheet h3 { margin:0 0 4px; font-size:19px; letter-spacing:-.03em; }
.sheet .hint { font-size:12px; color:var(--text-tertiary); margin-bottom:15px; }
.fld { margin-bottom:12px; }
.fld label { display:block; font-size:11px; font-weight:750; color:var(--text-tertiary);
  text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px; }
.fld input, .fld select, .fld textarea { width:100%; box-sizing:border-box; font:inherit; font-size:16px;
  padding:10px 12px; border-radius:10px; border:1px solid rgba(0,0,0,.09);

.fld textarea { resize:none; min-height:56px; font-size:15px; }
.fld input:focus, .fld select:focus, .fld textarea:focus { outline:none; border-color:var(--accent); }
.cur-seg { display:flex; gap:6px; }

.cur-seg button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
.sheet-actions { display:flex; gap:10px; margin-top:16px; }
.sheet-actions .btn { flex:1; }

/* ── 明细列表 ── */
.led { display:flex; align-items:center; gap:10px; padding:11px 14px;
  background:var(--bg-elevated); border-radius:var(--radius-md);
  box-shadow:var(--shadow-sm); margin-bottom:7px; }
.led .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.led .txt { flex:1; min-width:0; }
.led .t1 { font-size:14.5px; font-weight:650; letter-spacing:-.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.led .t2 { font-size:11.5px; color:var(--text-tertiary); margin-top:2px; }

.led .amt small { display:block; font-size:10.5px; font-weight:600; color:var(--text-tertiary); margin-top:2px; }
.led .del { border:none; background:none; color:var(--text-tertiary); font-size:15px;
  padding:4px 0 4px 8px; cursor:pointer; line-height:1; }

/* ── 时间线 ── */
.jn-date { font-size:12px; font-weight:750; color:var(--text-tertiary);
  letter-spacing:.02em; padding:16px 0 9px 24px; }
.jn-item { position:relative; padding:0 0 13px 24px; }
.jn-item::before { content:''; position:absolute; left:5px; top:8px; bottom:-6px;
  width:1.5px; background:rgba(0,0,0,.10); }
.jn-item:last-child::before { display:none; }
.jn-item::after { content:''; position:absolute; left:1px; top:5px; width:9px; height:9px;
  border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px var(--bg-elevated); }
.jn-item[data-tag="已订"]::after { background:#34c759; }
.jn-item[data-tag="花费"]::after { background:#ff9500; }
.jn-item[data-tag="提醒"]::after { background:#ff3b30; }
.jn-card { background:var(--bg-elevated); border-radius:12px; padding:11px 13px; box-shadow:var(--shadow-sm); }
.jn-time { font-size:11px; font-weight:750; color:var(--accent); letter-spacing:.02em; }
.jn-text { font-size:14.5px; line-height:1.52; margin-top:3px; word-break:break-word; white-space:pre-wrap; }
.jn-meta { font-size:10.5px; color:var(--text-tertiary); margin-top:7px;
  display:flex; gap:8px; align-items:center; }
.jn-meta .tag { background:var(--bg-grouped); padding:1.5px 7px; border-radius:5px; font-weight:700; }
.jn-del { margin-left:auto; border:none; background:none; color:var(--text-tertiary);

/* ── 记事输入 ── */
.log-bar textarea { width:100%; box-sizing:border-box; font:inherit; font-size:15px;
  padding:12px 14px; border-radius:12px; border:1px solid rgba(0,0,0,.09);
  background:var(--bg-elevated); resize:none; min-height:72px; box-shadow:var(--shadow-sm);
  line-height:1.5; }
.log-bar textarea:focus { outline:none; border-color:var(--accent); }
.log-row { display:flex; gap:8px; margin-top:9px; align-items:center; }
.log-row input[type="datetime-local"], .log-row select {
  font:inherit; font-size:12.5px; padding:8px 9px; border-radius:9px;
  border:1px solid rgba(0,0,0,.09); background:var(--bg-elevated); color:var(--text-primary);
  box-shadow:var(--shadow-sm); min-width:0; }
.log-row input[type="datetime-local"] { flex:1.5; }
.log-row select { flex:0.8; }
.log-row input:focus, .log-row select:focus { outline:none; border-color:var(--accent); }
.log-row .btn { flex:0 0 auto; white-space:nowrap; padding:9px 14px; font-size:14px; }

.note-block li::before { content:''; position:absolute; left:0; top:8px; width:4px; height:4px; border-radius:50%; background: var(--text-tertiary); }

.warn-box { background: rgba(255,59,48,.06); border:.5px solid rgba(255,59,48,.18); border-radius: var(--radius-md); padding:13px 15px; font-size:13px; line-height:1.6; margin-bottom:10px; }
.warn-box b { color: var(--tint-red); }

.toolbar { display:flex; gap:8px; margin-bottom:12px; }
.toolbar input {
  flex:1; border:none; background: var(--bg-elevated); border-radius:10px;
  padding:11px 14px; font-size:14px; font-family:inherit; color:var(--text-primary);
  box-shadow: var(--shadow-sm); outline:none;
}
.toolbar button { border:none; background: var(--bg-elevated); border-radius:10px; padding:0 14px; font-size:13px; font-weight:700; color:var(--accent); font-family:inherit; box-shadow:var(--shadow-sm); cursor:pointer; }

/* ── Leaflet ── */
.leaflet-popup-content-wrapper { border-radius:12px !important; box-shadow: var(--shadow-lg) !important; font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif !important; }

.leaflet-control-zoom { border-radius:11px !important; overflow:hidden; box-shadow: var(--shadow-md) !important; border:none !important; }

/* Toast */

  background: rgba(29,29,31,.92); color:#fff; padding:9px 16px; border-radius:980px;
  font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition: all .28s;

}

/* 分类图标：SVG，不依赖 emoji 字体 */

</style>

<script src="data.js?v=6"></script>
<script>
/* ═══════════════ 地图 ═══════════════ */
const ALL_LATLNG = [];
DAYS.forEach(d => d.locations.forEach(l => l.lat && ALL_LATLNG.push([l.lat, l.lng])));

const map = L.map('map', {
  center: [-44.0, 169.6], zoom: 6, zoomControl: false,
  attributionControl: true, zoomSnap: 1
});
L.control.zoom({ position: 'topright' }).addTo(map);

/* ── 底图：优先用打包进来的本地瓦片（离线可用、加载快）──
   覆盖范围 z5–z11，超出范围或放大到更高层级时才回落到网络瓦片。 */
const TILE_BOUNDS = L.latLngBounds([-50.0, 161.0], [-37.0, 179.0]);
const TRANSPARENT = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

const localTiles = L.tileLayer('tiles/{z}/{x}/{y}.png', {
  minZoom: 5, maxZoom: 11,
  errorTileUrl: TRANSPARENT, attribution: '© Esri · © OpenStreetMap'
}).addTo(map);

/* ── 网络瓦片：多个源按优先级探测，第一个通的就用 ── */
const TILE_SOURCES = [
  { url:'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    opt:{ maxZoom:19, subdomains:'abcd' } },
  { url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png', opt:{ maxZoom:19 } }
];
let netTiles = null, netOn = false;

function probeTile(src){
  return new Promise(resolve => {
    const tpl = src.url.replace('{z}','6').replace('{x}','60').replace('{y}','38')
                       .replace('{s}',(src.opt.subdomains||'a')[0]).replace('{r}','');
    const img = new Image();
    const done = ok => { clearTimeout(t); img.onload = img.onerror = null; resolve(ok); };
    const t = setTimeout(() => done(false), 6000);
    img.onload = () => done(img.width > 0);
    img.onerror = () => done(false);
    img.src = tpl;
  });
}
async function enableNetTiles(){
  if (netOn) return;
  netOn = true;
  for (const src of TILE_SOURCES) {
    if (await probeTile(src)) {
      netTiles = L.tileLayer(src.url, src.opt).addTo(map);
      netTiles.bringToBack();
      return;
    }
  }
}
// 本地瓦片确实取不到时才开网络兜底。阈值放宽，避免首屏还在下载就误判
let errCount = 0, errTimer = null;
localTiles.on('tileerror', () => {
  errCount++;
  clearTimeout(errTimer);
  errTimer = setTimeout(() => { errCount = 0; }, 4000);
  if (errCount >= 8) enableNetTiles();
});
localTiles.on('tileload', () => { errCount = 0; });
map.on('zoomend', () => { if (map.getZoom() > 11) enableNetTiles(); });

/* 地图控件：显示全部 / 全屏 / 定位 */
const ICON = {
  fit:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V5.5A2.5 2.5 0 0 1 5.5 3H8M21 8V5.5A2.5 2.5 0 0 0 18.5 3H16M3 16v2.5A2.5 2.5 0 0 0 5.5 21H8M21 16v2.5A2.5 2.5 0 0 1 18.5 21H16"/></svg>',
  full: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H3v6M21 9V3h-6M3 15v6h6M15 21h6v-6"/></svg>',
  shrink:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h6V3M15 3v6h6M21 15h-6v6M9 21v-6H3"/></svg>',
  loc:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg>'
};
function svgIcon(el, key){
  el.innerHTML = ICON[key];
  el.querySelector('svg').style.width = '17px';
  el.querySelector('svg').style.height = '17px';
}
const LocateControl = L.Control.extend({
  options: { position: 'bottomright' },
  onAdd() {
    const wrap = L.DomUtil.create('div', '');
    const fit = L.DomUtil.create('button', 'fit-btn', wrap);
    svgIcon(fit, 'fit'); fit.title = '显示全部';
    L.DomEvent.disableClickPropagation(fit);
    fit.addEventListener('click', () => fitAll());

    const full = L.DomUtil.create('button', 'fit-btn', wrap);
    svgIcon(full, 'full'); full.title = '全屏地图';
    L.DomEvent.disableClickPropagation(full);
    full.addEventListener('click', () => toggleMapFull(full));

    const btn = L.DomUtil.create('button', 'locate-btn', wrap);
    svgIcon(btn, 'loc'); btn.title = '我的位置';
    L.DomEvent.disableClickPropagation(btn);
    btn.addEventListener('click', () => { btn.classList.add('active'); map.locate({ setView: true, maxZoom: 14 }); });
    this._btn = btn;
    return wrap;
  }
});
new LocateControl().addTo(map);

map.on('dblclick', () => {
  const b = document.querySelectorAll('.fit-btn')[1];
  if (b) toggleMapFull(b);
});

function toggleMapFull(btn){
  const on = document.body.classList.toggle('map-full');
  svgIcon(btn, on ? 'shrink' : 'full');
  btn.title = on ? '收起地图' : '全屏地图';
  if (on) enableNetTiles();
  const relayout = () => { map.invalidateSize(); if (on) map.fitBounds(ALL_LATLNG, { padding:[10,10] }); };
  requestAnimationFrame(relayout);
  setTimeout(relayout, 120);
  setTimeout(relayout, 360);
}

let locMarker, locCircle;
map.on('locationfound', e => {
  const r = e.accuracy / 2;
  if (locMarker) { locMarker.setLatLng(e.latlng); locCircle.setLatLng(e.latlng).setRadius(r); return; }
  locMarker = L.marker(e.latlng, {
    icon: L.divIcon({ className:'', html:'<div style="width:14px;height:14px;border-radius:50%;background:#007aff;border:2.5px solid #fff;box-shadow:0 0 0 4px rgba(0,122,255,.22)"></div>', iconSize:[14,14], iconAnchor:[7,7] }),
    zIndexOffset: 2000
  }).addTo(map);
  locCircle = L.circle(e.latlng, { radius:r, color:'#007aff', fillColor:'#007aff', fillOpacity:.08, weight:1 }).addTo(map);
});

function pinIcon(color, emoji, big) {
  const s = big ? 30 : 26;
  return L.divIcon({
    className:'',
    html:`<div style="width:${s}px;height:${s}px;border-radius:50%;background:${color};border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center"><i style="width:${big?8:7}px;height:${big?8:7}px;border-radius:50%;background:rgba(255,255,255,.95);display:block"></i></div>`,
    iconSize:[s,s], iconAnchor:[s/2,s/2], popupAnchor:[0,-s/2]
  });
}
const EMOJI = { food:'🍴', spot:'●', hotel:'🏠', transport:'⛟', drink:'🍷' };

let layer = L.layerGroup().addTo(map);

function clearMap(){ layer.clearLayers(); }

function fitAll(){
  if (ALL_LATLNG.length) map.fitBounds(ALL_LATLNG, { padding:[28,28] });
}

function popupHtml(l, day){
  const gq = l.gmap || `${l.name} New Zealand`;
  return `<div style="font-weight:700;font-size:14px;letter-spacing:-.01em">${l.name}</div>
  <div style="color:#86868b;font-size:12px;margin-top:1px">${day.label} · ${l.time!=='—'?l.time:'备选'}</div>
  <div style="margin-top:6px;font-size:12.5px;line-height:1.45;color:#3a3a3c">${l.desc}</div>
  <div style="margin-top:8px;display:flex;gap:8px">
    <a href="#" onclick="event.preventDefault();openAS(${l.lat},${l.lng},'${(l.name||'').replace(/'/g,"\\'")}')" style="font-weight:700;font-size:12.5px">➤ 导航</a>
    <a href="#" onclick="event.preventDefault();copyLoc(${l.lat},${l.lng},'${(l.name||'').replace(/'/g,"\\'")}')" style="font-weight:700;font-size:12.5px;color:#86868b">复制坐标</a>
  </div>`;
}

function showDay(idx){
  clearMap();
  if (idx === 0) {
    // 全线路线
    const pts = [];
    DAYS.slice(1).forEach(d => {
      const day = d.locations.filter(l => l.lat && l.time !== '—');
      if (!day.length) return;
      const line = L.polyline(day.map(l=>[l.lat,l.lng]), {
        color: d.color, weight: 2.6, opacity: .62, dashArray:'7,6', lineCap:'round'
      }).addTo(layer);
      day.forEach(l => {
        L.marker([l.lat,l.lng], { icon: pinIcon(d.color, EMOJI[l.type]||'📍') })
          .addTo(layer).bindPopup(popupHtml(l, d));
      });
      pts.push(...day.map(l=>[l.lat,l.lng]));
    });
    // 住宿节点大标
    STAYS.forEach(s => {
      if (s.lat) L.marker([s.lat, s.lng], { zIndexOffset: 900, icon: L.divIcon({
          className:'',
          html:`<div style="width:30px;height:30px;border-radius:9px;background:#1d1d1f;border:2.5px solid #fff;box-shadow:0 2px 9px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center"><i style="width:9px;height:9px;border-radius:2.5px;background:#fff;display:block"></i></div>`,
          iconSize:[30,30], iconAnchor:[15,15], popupAnchor:[0,-15]
        }) })
        .addTo(layer).bindPopup(`<b>${s.city}</b><br><span style="color:#86868b;font-size:12px">${s.nights}</span>`);
    });
    if (pts.length) map.fitBounds(pts, { padding:[30,30] });
    return;
  }
  const day = DAYS.find(d => d.id === idx);
  if (!day) return;
  const coords = [];
  day.locations.forEach(l => {
    if (!l.lat) return;
    L.marker([l.lat,l.lng], { icon: pinIcon(day.color, EMOJI[l.type]||'📍') })
      .addTo(layer).bindPopup(popupHtml(l, day));
    if (l.time !== '—') coords.push([l.lat,l.lng]);
  });
  if (coords.length > 1) {
    L.polyline(coords, { color: day.color, weight: 3, opacity: .55, dashArray:'7,6', lineCap:'round' }).addTo(layer);
  }
  if (coords.length) map.fitBounds(coords, { padding:[44,44], maxZoom: 13 });
}

/* ═══════════════ 预算 ═══════════════ */
const BD_KEY = 'nz-trip-budget-2026';
const COLORS = { flight:'#007aff', stay:'#ff9500', car:'#34c759', exp:'#af52de', fuel:'#30b0c7', food:'#ff3b30', other:'#8e8e93' };
const PALETTE = ['#007aff','#ff9500','#34c759','#af52de','#30b0c7','#ff3b30','#8e8e93','#5ac8fa','#ff2d55','#ffcc00','#5856d6','#a2845e'];
const CUR_SYM = { NZD:'NZ$', CNY:'¥', USD:'US$' };

function colorOf(k){
  if (COLORS[k]) return COLORS[k];
  let h = 0;
  for (let i = 0; i < k.length; i++) h = (h * 31 + k.charCodeAt(i)) >>> 0;
  return PALETTE[h % PALETTE.length];
}

function defaultBudget(){
  return {
    v: 2,
    rate: DEFAULT_RATE,          // 1 纽币 = ? 人民币
    usd: 1.62,                   // 1 美元 = ? 纽币
    cats: BUDGET_CATS.map(c => ({ k:c.k, name:c.name, icon:c.icon, plan:c.plan, note:c.note })),
    entries: []
  };
}

/* 旧结构 {plan, act, rate} 迁移成流水 */
function legacyToV2(old){
  const b = defaultBudget();
  b.rate = old.rate || DEFAULT_RATE;
  b.cats = b.cats.map(c => ({ ...c, plan: (old.plan && old.plan[c.k]) || 0 }));
  const today = new Date().toISOString().slice(0,10);
  let n = 0;
  b.entries = b.cats.filter(c => (old.act && old.act[c.k]) > 0).map(c => ({
    id: 'lg' + (n++), amt: old.act[c.k], cur: 'NZD', cat: c.k,
    date: today, note: '之前直接填的汇总', ts: Date.now() + n
  }));
  return b;
}

function getBudget(){
  try {
    const s = JSON.parse(localStorage.getItem(BD_KEY));
    if (s && s.v === 2 && Array.isArray(s.cats)) {
      if (!Array.isArray(s.entries)) s.entries = [];
      return s;
    }
    if (s && s.plan && s.act) {
      const nb = legacyToV2(s);
      localStorage.setItem(BD_KEY, JSON.stringify(nb));   // 迁移后立刻落盘
      return nb;
    }
  } catch(e){}
  return defaultBudget();
}
function saveBudget(b){ localStorage.setItem(BD_KEY, JSON.stringify(b)); }

const fmt = n => Math.round(n).toLocaleString('en-US');
const toCNY = (nzd, rate) => nzd * rate;
function toNZD(amt, cur, b){
  if (cur === 'CNY') return amt / (b.rate || DEFAULT_RATE);
  if (cur === 'USD') return amt * (b.usd || 1.62);
  return amt;
}
function spentBy(b, k){
  return b.entries.filter(e => e.cat === k).reduce((t,e) => t + toNZD(e.amt, e.cur, b), 0);
}
function totalPlan(b){ return b.cats.reduce((t,c) => t + (+c.plan || 0), 0); }
function totalSpent(b){ return b.entries.reduce((t,e) => t + toNZD(e.amt, e.cur, b), 0); }

/* 分享编码：只带类目和预算，明细太长不进 URL */
function encBudget(b){
  const o = {
    r: b.rate, u: b.usd,
    c: b.cats.map(c => [c.k, c.name, +c.plan || 0])
  };
  try {
    const s = JSON.stringify(o);
    return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  } catch(e){ return ''; }
}
function decBudget(str){
  try {
    const s = decodeURIComponent(escape(atob(str.replace(/-/g,'+').replace(/_/g,'/'))));
    const o = JSON.parse(s);
    if (!o || !Array.isArray(o.c)) return null;
    const b = defaultBudget();
    b.rate = o.r || DEFAULT_RATE;
    b.usd = o.u || 1.62;
    b.cats = o.c.map(([k, name, plan]) => ({ k, name, icon:'', plan, note:'' }));
    b.entries = [];
    return b;
  } catch(e){ return null; }
}

/* 被分享进来的只读预算 */
let SHARED = null;
try {
  const q = new URLSearchParams(location.search).get('b')
         || (location.hash.match(/b=([A-Za-z0-9_-]+)/) || [])[1];
  if (q) SHARED = decBudget(q);
} catch(e){}

function renderBudget(){
  const b = SHARED || getBudget();
  const ro = !!SHARED;
  const dis = ro ? 'disabled' : '';
  const tPlan = totalPlan(b), tSpent = totalSpent(b);
  const left = tPlan - tSpent;

  const rows = b.cats.map(c => {
    const p = +c.plan || 0;
    const a = spentBy(b, c.k);
    const pct = p > 0 ? Math.min(100, a / p * 100) : 0;
    const over = a > p && p > 0;
    const ic = c.icon
      ? `<svg viewBox="0 0 24 24">${c.icon}</svg>`
      : `<b style="font-size:11px;letter-spacing:-.02em">${(c.name||'?').slice(0,1)}</b>`;
    return `<div class="bd-row">
      <div class="h">
        <div class="ic" style="color:${colorOf(c.k)}">${ic}</div>
        <div class="nm">${c.name}<span class="bd-pct" style="margin-left:6px">${p>0?Math.round(a/p*100):0}%</span></div>
        <div class="amt">
          <span class="bd-num" style="font-size:15px;font-weight:750;letter-spacing:-.02em">${fmt(a)}</span>
          <span class="cur">/</span>
          <input type="number" inputmode="decimal" value="${p||''}" placeholder="0"
            data-k="${c.k}" data-f="plan" oninput="bdPlan(this)" ${dis}>
          <span class="cur">NZ$</span>
        </div>
      </div>
      <div class="bd-bar"><i class="${over?'over':''}" style="width:${pct}%;background:${over?'':colorOf(c.k)}"></i></div>
      ${c.note ? `<div class="note">${c.note}</div>` : ''}
    </div>`;
  }).join('');

  const list = [...b.entries].sort((x,y) => (y.ts||0) - (x.ts||0));
  const ledHtml = list.length ? list.map(e => {
    const c = b.cats.find(x => x.k === e.cat);
    const nzd = toNZD(e.amt, e.cur, b);
    return `<div class="led">
      <div class="dot" style="background:${colorOf(e.cat)}"></div>
      <div class="txt">
        <div class="t1">${e.note || (c ? c.name : '未分类')}</div>
        <div class="t2">${c ? c.name : '未分类'} · ${e.date || ''}</div>
      </div>
      <div class="amt">${CUR_SYM[e.cur] || ''}${fmt(e.amt)}<small>≈ NZ$ ${fmt(nzd)}</small></div>
      ${ro ? '' : `<button class="del" onclick="delLedger('${e.id}')">×</button>`}
    </div>`;
  }).join('') : `<div class="empty">还没有记账。<br>点上面「记一笔」，花一笔记一笔。</div>`;

  return `
  <div class="hero" style="padding-bottom:14px">
    <div class="eyebrow">Budget</div>
    <h1 style="font-size:30px">预算</h1>
    <div class="sub">花一笔记一笔，自动折算成纽币。数据存在本机，不上传。</div>
  </div>

  ${ro ? `<div class="banner info"><b>→</b> 这是别人分享给你的预算（只读，不含流水）
    <button onclick="importShared()">存为我的</button></div>` : ''}

  <div class="bd-top">
    <div>
      <div class="label">1 纽币 =</div>
      <input type="number" inputmode="decimal" step="0.01" value="${b.rate}" oninput="bdRate(this)" ${dis}>
      <div class="unit">人民币 ¥</div>
    </div>
    <div>
      <div class="label">1 美元 =</div>
      <input type="number" inputmode="decimal" step="0.01" value="${b.usd}" oninput="bdUsd(this)" ${dis}>
      <div class="unit">纽币 NZ$</div>
    </div>
  </div>

  <div class="bd-total">
    <div class="cap">已花费</div>
    <div class="big">NZ$ ${fmt(tSpent)}</div>

/* ── 记账面板 ── */
let LG_CUR = 'NZD';

function sheetHtml(kind){
  const b = getBudget();
  if (kind === 'ledger') {
    const opts = b.cats.map(c => `<option value="${c.k}">${c.name}</option>`).join('');
    return `<h3>记一笔</h3>
      <div class="hint">选币种填金额，自动按汇率折成纽币。</div>
      <div class="fld"><label>金额</label>
        <input type="number" inputmode="decimal" id="lgAmt" placeholder="0" autocomplete="off"></div>
      <div class="fld"><label>币种</label>
        <div class="cur-seg" id="lgCur">
          <button data-c="NZD" class="on" onclick="pickCur(this)">纽币 NZ$</button>
          <button data-c="CNY" onclick="pickCur(this)">人民币 ¥</button>
          <button data-c="USD" onclick="pickCur(this)">美元 US$</button>
        </div></div>
      <div class="fld"><label>类目</label><select id="lgCat">${opts}</select></div>
      <div class="fld"><label>日期</label><input type="date" id="lgDate" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="fld"><label>备注（可选）</label>
        <input id="lgNote" placeholder="比如：南航往返机票 2 人" autocomplete="off"></div>
      <div class="sheet-actions">
        <button class="btn" onclick="closeSheet()">取消</button>
        <button class="btn nav" onclick="saveLedger()">记下</button>
      </div>`;
  }
  if (kind === 'cat') {
    return `<h3>新增类目</h3>
      <div class="hint">想记什么都行，比如签证、伴手礼、停车费。</div>
      <div class="fld"><label>类目名称</label>
        <input id="catName" placeholder="比如：签证" autocomplete="off"></div>
      <div class="fld"><label>预算金额（纽币，可留空）</label>
        <input type="number" inputmode="decimal" id="catPlan" placeholder="0"></div>
      <div class="sheet-actions">
        <button class="btn" onclick="closeSheet()">取消</button>
        <button class="btn nav" onclick="saveCat()">加上</button>
      </div>`;
  }
  return '';
}

function openSheet(kind){
  let mask = document.getElementById('shMask');
  let sheet = document.getElementById('shSheet');
  if (!mask) {
    mask = document.createElement('div');
    mask.id = 'shMask'; mask.className = 'sheet-mask';
    mask.onclick = closeSheet;
    document.body.appendChild(mask);
  }
  if (!sheet) {
    sheet = document.createElement('div');
    sheet.id = 'shSheet'; sheet.className = 'sheet';
    document.body.appendChild(sheet);
  }
  sheet.innerHTML = sheetHtml(kind);
  LG_CUR = 'NZD';
  requestAnimationFrame(() => {
    mask.classList.add('on');
    sheet.classList.add('on');
    const f = sheet.querySelector('input');
    if (f) setTimeout(() => f.focus(), 320);
  });
}
function closeSheet(){
  const mask = document.getElementById('shMask');
  const sheet = document.getElementById('shSheet');
  if (mask) mask.classList.remove('on');
  if (sheet) sheet.classList.remove('on');
}
function pickCur(btn){
  LG_CUR = btn.dataset.c;
  btn.parentNode.querySelectorAll('button').forEach(x => x.classList.remove('on'));
  btn.classList.add('on');
}

function saveLedger(){
  const amt = parseFloat(document.getElementById('lgAmt').value);
  if (!amt || amt <= 0) { toast('先填个金额'); return; }
  const b = getBudget();
  b.entries.push({
    id: 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,5),
    amt, cur: LG_CUR,
    cat: document.getElementById('lgCat').value,
    date: document.getElementById('lgDate').value || new Date().toISOString().slice(0,10),
    note: document.getElementById('lgNote').value.trim(),
    ts: Date.now()
  });
  saveBudget(b);
  closeSheet();
  document.getElementById('pane-budget').innerHTML = renderBudget();
  toast('已记下');
}

function delLedger(id){
  const b = getBudget();
  const e = b.entries.find(x => x.id === id);
  if (!e) return;
  if (!confirm(`删掉这一笔？（${CUR_SYM[e.cur] || ''}${fmt(e.amt)}）`)) return;
  b.entries = b.entries.filter(x => x.id !== id);
  saveBudget(b);
  document.getElementById('pane-budget').innerHTML = renderBudget();
  toast('已删除');
}

function addCat(){ openSheet('cat'); }
function saveCat(){
  const name = document.getElementById('catName').value.trim();
  if (!name) { toast('给类目起个名字'); return; }
  const b = getBudget();
  const k = 'c' + Date.now().toString(36);
  b.cats.push({ k, name, icon:'', plan: parseFloat(document.getElementById('catPlan').value) || 0, note:'' });
  saveBudget(b);
  closeSheet();
  document.getElementById('pane-budget').innerHTML = renderBudget();
  toast('类目已添加');
}

/* 改预算：只刷新数字，不动输入框，光标不跳 */
function bdPlan(el){
  if (SHARED) return;
  const b = getBudget();
  const c = b.cats.find(x => x.k === el.dataset.k);
  if (!c) return;
  c.plan = parseFloat(el.value) || 0;
  saveBudget(b);
  repaintBudget();
}
function bdRate(el){
  if (SHARED) return;
  const b = getBudget();
  b.rate = parseFloat(el.value) || DEFAULT_RATE;
  saveBudget(b);
  repaintBudget();
}
function bdUsd(el){
  if (SHARED) return;
  const b = getBudget();
  b.usd = parseFloat(el.value) || 1.62;
  saveBudget(b);
  repaintBudget();
}

/* 只更新数字，不重建输入框 */
function repaintBudget(){
  const b = getBudget();
  const pane = document.getElementById('pane-budget');
  if (!pane || !pane.querySelector('.bd-total')) {
    if (pane) pane.innerHTML = renderBudget();
    return;
  }
  const tPlan = totalPlan(b), tSpent = totalSpent(b), left = tPlan - tSpent;
  const box = pane.querySelector('.bd-total');
  box.querySelector('.big').textContent = 'NZ$ ' + fmt(tSpent);
  box.children[2].innerHTML = `≈ ¥ ${fmt(toCNY(tSpent,b.rate))}　·　预算 NZ$ ${fmt(tPlan)}`;
  const vs = box.querySelectorAll('.grid .v');
  vs[0].textContent = fmt(left < 0 ? 0 : left);
  vs[1].textContent = fmt(tSpent / TRIP_PEOPLE);
  vs[2].textContent = fmt(tSpent > 0 ? tSpent / TRIP_DAYS : tPlan / TRIP_DAYS);

  b.cats.forEach(c => {
    const inp = pane.querySelector(`.bd-row input[data-k="${c.k}"]`);
    if (!inp) return;
    const row = inp.closest('.bd-row');
    const p = +c.plan || 0, a = spentBy(b, c.k);
    const over = a > p && p > 0;
    const pct = p > 0 ? Math.min(100, a/p*100) : 0;
    const num = row.querySelector('.bd-num');
    if (num) num.textContent = fmt(a);
    const pctEl = row.querySelector('.bd-pct');
    if (pctEl) pctEl.textContent = (p > 0 ? Math.round(a/p*100) : 0) + '%';
    const bar = row.querySelector('.bd-bar i');
    if (bar) {
      bar.style.width = pct + '%';
      bar.className = over ? 'over' : '';
      if (!over) bar.style.background = colorOf(c.k);
    }
  });

  let warn = pane.querySelector('.banner.warn');
  if (left < 0) {
    const txt = `▲ 已超预算 NZ$ ${fmt(-left)}（≈ ¥${fmt(toCNY(-left,b.rate))}）`;
    if (warn) warn.innerHTML = txt;
    else {
      warn = document.createElement('div');
      warn.className = 'banner warn';
      warn.innerHTML = txt;
      box.insertAdjacentElement('afterend', warn);
    }
  } else if (warn) warn.remove();

  const su = document.getElementById('shareUrl');
  if (su) su.textContent = location.origin + location.pathname + '?b=' + encBudget(b);
}

function resetBudget(){
  if (!confirm('恢复成默认预算？你记的账和自定义类目都会清空。')) return;
  localStorage.removeItem(BD_KEY);
  document.getElementById('pane-budget').innerHTML = renderBudget();

function importShared(){

  history.replaceState({}, '', u.pathname + u.hash);

function copyShare(){ copyText(shareLink()); }
function openShare(){ window.open(shareLink(), '_blank'); }

/* ═══════════════ 记事（时间线） ═══════════════ */
const LOG_KEY = 'nz-trip-log-2026';
const LOG_TAGS = ['备忘','已订','花费','提醒'];

function getLog(){
  try {
    const a = JSON.parse(localStorage.getItem(LOG_KEY));
    if (Array.isArray(a)) return a;
  } catch(e){}
  return [];
}
function saveLog(a){ localStorage.setItem(LOG_KEY, JSON.stringify(a)); }

function pad(n){ return n < 10 ? '0' + n : '' + n; }
function nowLocal(){
  const d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate())
       + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function dayKey(iso){ return (iso || '').slice(0,10); }
function dayLabel(k){
  if (!k) return '未填日期';
  const [y,m,d] = k.split('-');
  const dt = new Date(+y, +m - 1, +d);
  const w = ['周日','周一','周二','周三','周四','周五','周六'][dt.getDay()];
  return `${+m} 月 ${+d} 日 · ${w}`;
}
function timeLabel(iso){
  const t = (iso || '').slice(11,16);
  return t || '--:--';
}

function renderLog(){
  const list = [...getLog()].sort((a,b) => (b.when || '').localeCompare(a.when || '') || (b.ts||0) - (a.ts||0));

  const groups = [];
  list.forEach(it => {
    const k = dayKey(it.when);
    let g = groups.find(x => x.k === k);
    if (!g) { g = { k, items: [] }; groups.push(g); }
    g.items.push(it);
  });

  const tl = groups.length ? groups.map(g => `
    <div class="jn-day">
      <div class="jn-date">${dayLabel(g.k)}</div>
      ${g.items.map(it => `
        <div class="jn-item" data-tag="${it.tag || '备忘'}">
          <div class="jn-card">
            <div class="jn-time">${timeLabel(it.when)}</div>
            <div class="jn-text">${esc(it.text)}</div>
            <div class="jn-meta">
              <span class="tag">${it.tag || '备忘'}</span>
              ${it.ts ? `<span>记于 ${new Date(it.ts).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span>` : ''}
              <button class="jn-del" onclick="delLog('${it.id}')">删除</button>
            </div>
          </div>
        </div>`).join('')}
    </div>`).join('')
    : `<div class="empty">还没有记录。<br>上面写一句，点「记下」，就会按时间排在这里。</div>`;

  return `
  <div class="hero" style="padding-bottom:14px">
    <div class="eyebrow">Journal</div>
    <h1 style="font-size:30px">记事</h1>
    <div class="sub">这趟旅行发生的每件事，随手记一句，自动带时间。共 <b>${getLog().length}</b> 条。</div>
  </div>

  <div class="log-bar">
    <textarea id="logText" placeholder="今天做了什么？比如：订好了南航机票，两个人往返 6980"></textarea>
    <div class="log-row">
      <input type="datetime-local" id="logWhen" value="${nowLocal()}">
      <select id="logTag">${LOG_TAGS.map(t => `<option>${t}</option>`).join('')}</select>
      <button class="btn nav" onclick="addLog()">记下</button>
    </div>
  </div>

  <div id="tlList">${tl}</div>
  `;
}

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function addLog(){
  const ta = document.getElementById('logText');
  const text = (ta.value || '').trim();
  if (!text) { toast('写点什么再记'); ta.focus(); return; }
  const when = document.getElementById('logWhen').value || nowLocal();
  const tag = document.getElementById('logTag').value;
  const a = getLog();
  a.push({ id:'l' + Date.now().toString(36), when, tag, text, ts: Date.now() });
  saveLog(a);
  document.getElementById('pane-log').innerHTML = renderLog();
  const nt = document.getElementById('logText');
  if (nt) nt.focus();
  toast('已记下');
}

function delLog(id){
  const a = getLog().filter(x => x.id !== id);
  saveLog(a);
  document.getElementById('pane-log').innerHTML = renderLog();
  toast('已删除');
}

function copyText(txt){
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(txt).then(()=>toast('链接已复制')).catch(()=>fb(txt));
  } else fb(txt);
  function fb(t){
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('链接已复制'); } catch(e){ toast('长按链接手动复制'); }
    document.body.removeChild(ta);
  }
}

const CK_KEY = 'nz-trip-check-2026';
function getCk(){ try { return JSON.parse(localStorage.getItem(CK_KEY) || '{}'); } catch(e){ return {}; } }
function setCk(o){ localStorage.setItem(CK_KEY, JSON.stringify(o)); }

function renderNotes(){

  ${CHECKLIST.map(g => `
    <div class="ck-group">

      }).join('')}
    </div>`).join('')}

  ${NOTE_SECTIONS.map(s => `

  <div class="note-block">

      <li>这是<b>参考坐标</b>，不是必须逐条执行的脚本。天气、体力、临时发现的小店都可以覆盖它。</li>
      <li>每天标注了"主区域"，实在走不动就只做主线，备选直接放弃。</li>
      <li>所有营业时间与价格请在出发前二次核实，尤其圣诞和元旦期间。</li>
      <li>数据来源：NZTA、QLDC、各家运营方官网、2026 年公开航班时刻。社交媒体内容未用于营业时间判断。</li>
    </ul>
  </div>
  <div style="text-align:center;font-size:11.5px;color:var(--text-tertiary);padding:14px 0 4px">
    ${TRIP.dateRange} · 新西兰南岛 · 2 人自驾
  </div>
  `;
}

function toggleCk(el, key){
  const ck = getCk();
  ck[key] = !ck[key];
  setCk(ck);
  el.classList.toggle('on', ck[key]);
  el.querySelector('.ck-box').textContent = ck[key] ? '✓' : '';
}

function doSearch(q){
  const out = document.getElementById('searchOut');
  q = (q || '').trim().toLowerCase();
  if (q.length < 1) { out.innerHTML = ''; return; }
  const hits = [];
  DAYS.slice(1).forEach(d => d.locations.forEach(l => {
    const hay = (l.name + ' ' + l.desc + ' ' + (l.detail||'') + ' ' + d.title).toLowerCase();
    if (hay.includes(q)) hits.push({ d, l });
  }));
  out.innerHTML = hits.length
    ? hits.slice(0,12).map(h => `<div class="hit" onclick="go(${h.d.id});setTimeout(()=>map.setView([${h.l.lat},${h.l.lng}],14),350)">
        <div>${h.l.name}</div><small>${h.d.label} · ${h.d.title}${h.l.time!=='—'?' · '+h.l.time:''}</small></div>`).join('')
    : `<div class="hit" style="color:var(--text-secondary)">没找到。试试"冰川""峡湾""观星"。</div>`;
}

DAYS.forEach(d => {

/* 底部 tab */
function paintPane(p){
  const el = document.getElementById('pane-' + p);
  if (!el) return;
  if (p === 'trip') return;                      // 行程页常驻，不重绘
  try {
    if (p === 'stay')   el.innerHTML = renderStays();
    if (p === 'bk')     el.innerHTML = renderBookings();
    if (p === 'budget') el.innerHTML = renderBudget();
    if (p === 'log')    el.innerHTML = renderLog();
    if (p === 'note')   el.innerHTML = renderNotes();
  } catch (err) {
    console.error('[pane] render failed:', p, err);
    el.innerHTML = `<div class="hero"><div class="eyebrow">出错了</div>
      <h1 style="font-size:26px">这一页没渲染出来</h1>
      <div class="sub">多半是缓存了旧版本。点下面按钮强制刷新。</div></div>
      <div style="padding:0 20px"><button class="btn nav" style="width:100%"
        onclick="hardReload()">强制刷新到最新版</button></div>`;
  }
}
async function hardReload(){
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    if (reg) { await reg.update(); if (reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'}); }
    const keys = await caches.keys();
    await Promise.all(keys.map(k => caches.delete(k)));
  } catch(e){}
  location.replace(location.pathname + location.search + '&_r=' + Date.now());
}

document.querySelectorAll('.bnav button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.bnav button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    const p = b.dataset.pane;
    document.querySelectorAll('.pane').forEach(x => x.classList.remove('active'));
    const target = document.getElementById('pane-' + p);
    paintPane(p);                                 // 先渲染，避免切过去是空白
    target.classList.add('active');

    /* 地图和日期条只有行程页需要，其余页收起来 */
    const mw = document.querySelector('.map-wrap');
    const tabs = document.getElementById('tabs');
    const isTrip = (p === 'trip');
    if (mw) mw.style.display = isTrip ? '' : 'none';
    if (tabs) tabs.style.display = isTrip ? '' : 'none';

    if (isTrip) { setTimeout(()=>map.invalidateSize(), 60); }
    window.scrollTo({ top: 0, behavior: 'smooth' });
    if (!isTrip) setTimeout(()=>map.invalidateSize(), 120);
  });
});

/* 顶栏高度实测：不同机型安全区/字号有差异，用真实高度兜底 */
function syncTopbarH(){
  const el = document.getElementById('topbar');
  if (!el) return;
  const h = el.offsetHeight;
  if (h > 0) document.documentElement.style.setProperty('--topbar-h', h + 'px');
}
syncTopbarH();
setTimeout(syncTopbarH, 200);
window.addEventListener('resize', syncTopbarH);
window.addEventListener('orientationchange', () => setTimeout(syncTopbarH, 260));

/* 滚动时顶栏描边 */

/* ═══════════════ 倒计时 ═══════════════ */
function tick(){
  const el = document.getElementById('cd');
  const now = Date.now();
  const start = new Date(TRIP.start).getTime();
  const end = new Date(TRIP.end).getTime();
  if (now < start) {
    const d = Math.ceil((start - now) / 86400000);
    el.textContent = d > 0 ? `还有 ${d} 天` : '今天出发';
    el.classList.remove('live');
  } else if (now <= end) {
    const d = Math.floor((now - start) / 86400000) + 1;
    el.textContent = `第 ${d} 天 · 行程中`;
    el.classList.add('live');
  } else {
    el.textContent = '已完成';
    el.classList.remove('live');
  }
}
tick(); setInterval(tick, 60000);

const IN_APP = /micromessenger|xhs|discover|weibo|qq\/|alipayclient|dingtalk|lark|feishu|toutiao/i.test(navigator.userAgent);
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

const asOverlay = document.createElement('div');
asOverlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .24s';
asOverlay.innerHTML = `<div style="width:100%;max-width:420px;padding:0 8px calc(34px + env(safe-area-inset-bottom))">
  <div id="asTitle" style="text-align:center;font-size:12px;color:rgba(255,255,255,.8);padding:0 0 10px;font-weight:600"></div>
  <div id="asOpts" style="background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:14px;overflow:hidden;margin-bottom:8px"></div>
  <div style="background:rgba(255,255,255,.96);border-radius:14px;overflow:hidden">
    <button onclick="closeAS()" style="width:100%;padding:16px;border:none;background:none;font-size:17px;font-weight:700;color:#007aff;font-family:inherit">取消</button>
  </div></div>`;
document.body.appendChild(asOverlay);
asOverlay.addEventListener('click', e => { if (e.target === asOverlay) closeAS(); });

function asBtn(label, action){
  return `<button onclick="${action}" style="width:100%;padding:16px;border:none;background:none;font-size:17px;color:#007aff;font-weight:500;font-family:inherit;border-top:.5px solid rgba(0,0,0,.1)">${label}</button>`;
}

function openAS(lat, lng, name){
  const enc = encodeURIComponent(name || '目的地');
  const apple = IN_APP
    ? `https://maps.apple.com/?q=${lat},${lng}&ll=${lat},${lng}&name=${enc}`
    : `maps://maps.apple.com/?q=${lat},${lng}&name=${enc}`;
  const gmap = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`;
  const waze = `https://waze.com/ul?ll=${lat},${lng}&navigate=yes`;
  document.getElementById('asTitle').textContent = name;
  let html = '';
  html += asBtn('🍎 Apple 地图', `window.open('${apple}');closeAS()`);
  html += asBtn('🗺 Google 地图', `window.open('${gmap}');closeAS()`);
  html += asBtn('🚗 Waze', `window.open('${waze}');closeAS()`);
  html += asBtn('📋 复制坐标（粘到高德/百度）', `copyLoc(${lat},${lng},'${(name||'').replace(/'/g,"\\'")}');closeAS()`);
  document.getElementById('asOpts').innerHTML = html;
  asOverlay.style.opacity = 1; asOverlay.style.pointerEvents = 'auto';
}
function closeAS(){ asOverlay.style.opacity = 0; asOverlay.style.pointerEvents = 'none'; }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2000);
}
function copyLoc(lat, lng, name){
  const txt = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  const done = () => toast('已复制 ' + txt);
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt, done));
  } else fallbackCopy(txt, done);
  return false;
}
function fallbackCopy(txt, cb){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); cb(); } catch(e){ toast(txt); }
  document.body.removeChild(ta);
}

/* ═══════════════ 新版本提示 ═══════════════ */
let newWorker = null;
const updEl = document.createElement('div');
updEl.id = 'upd';
updEl.innerHTML = `<span>有新版本</span><button onclick="applyUpdate()">更新</button><button class="x" onclick="updEl.classList.remove('show')">×</button>`;
document.body.appendChild(updEl);

function applyUpdate(){
  if (newWorker) newWorker.postMessage({ type:'SKIP_WAITING' });
  window.location.reload();
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      newWorker = reg.installing;
      newWorker.addEventListener('statechange', () => {
        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          updEl.classList.add('show');
        }
      });
    });
    // 每次回到前台检查一次
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update(); });
    setInterval(() => reg.update(), 30 * 60 * 1000);
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (window._reloaded) return;
    window._reloaded = true;
    window.location.reload();
  });
}
