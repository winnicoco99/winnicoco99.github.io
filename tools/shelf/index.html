<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>收藏夹</title>
<meta name="theme-color" content="#EFEAE0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="../../icons/icon-180.png">
<meta name="referrer" content="no-referrer">

<link rel="stylesheet" href="../../theme.css">
<style>
  header { margin-bottom:26px; }
  .head-top { display:flex; align-items:center; gap:14px; margin-bottom:24px; }
  .head-top .overline { color:var(--text-sec); }

  /* ===== 通用小件 ===== */
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .btn-ghost {
    font-family:var(--serif); font-weight:900; font-size:14px;
    color:var(--text); background:transparent;
    border:1.5px solid var(--line); border-radius:var(--radius);
    padding:10px 18px; cursor:pointer;
    transition:border-color .15s, color .15s;
  }
  .btn-ghost:hover { border-color:var(--orange); color:var(--orange); }
  .btn-ghost:disabled { opacity:.4; cursor:default; }
  .btn-sm { padding:7px 13px; font-size:13px; }

  .linkbtn {
    background:none; border:none; cursor:pointer;
    font-family:var(--mono); font-size:11px; letter-spacing:1.2px;
    color:var(--text-sec); transition:color .15s;
    text-decoration:none;
  }
  .linkbtn:hover { color:var(--orange); }

  .iconbtn {
    background:none; border:none; cursor:pointer;
    font-family:var(--mono); font-size:15px; color:var(--text-sec);
    opacity:.55; padding:0 5px; line-height:1.4;
    transition:opacity .15s, color .15s;
  }
  .iconbtn:hover { opacity:1; color:var(--orange); }

  .empty {
    background:var(--cream-deep); border-radius:var(--radius-lg);
    padding:52px 30px; text-align:center;
    color:var(--text-sec); font-size:15px; line-height:1.8;
  }

  .chip {
    background:var(--cream-deep); border:1px solid transparent;
    border-radius:99px;
    font-family:var(--mono); font-size:12px; letter-spacing:.5px;
    color:var(--text-sec);
    padding:8px 14px; cursor:pointer;
    transition:background .15s, color .15s;
  }
  .chip:hover { background:#DCD5C5; }
  .chip.on { background:var(--orange); color:#fff; }
  .chip.ghost { background:transparent; border:1px dashed var(--line); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }

  /* ===== 视图切换：下划线式 ===== */
  .tabs {
    display:flex; gap:26px;
    border-bottom:1px solid var(--line);
    margin-bottom:24px;
  }
  .tabs.hide { display:none; }
  .tab {
    background:none; border:none; cursor:pointer;
    font-family:var(--serif); font-weight:900; font-size:17px;
    color:var(--text-sec);
    padding:0 0 12px; margin-bottom:-1px;
    border-bottom:2px solid transparent;
    transition:color .15s, border-color .15s;
  }
  .tab.on { color:var(--text); border-bottom-color:var(--orange); }

  .view { display:none; }
  .view.on { display:block; }

  /* ===== 统计条 ===== */
  .stats {
    display:grid; grid-template-columns:repeat(4, 1fr);
    gap:1px; background:var(--line-soft);
    border-radius:var(--radius); overflow:hidden;
    margin-bottom:22px;
  }
  .stat { background:var(--cream-deep); padding:14px 8px; text-align:center; }
  .stat b {
    display:block; font-family:var(--serif); font-weight:900;
    font-size:24px; line-height:1.25; letter-spacing:-.5px;
  }
  .stat span {
    font-family:var(--mono); font-size:10px; letter-spacing:1.2px;
    text-transform:uppercase; color:var(--text-sec);
  }
  .stat.today b { color:var(--orange); }

  .addbar { display:flex; gap:10px; margin-bottom:14px; }
  .addbar .btn { flex:1; }
  #search { width:100%; margin:14px 0 20px; }

  /* ===== 条目列表 =====
     取消封面，一行压到一行文字的高度，一屏能扫十几条。
     状态点前置，橙色=在看，扫一眼知道手上在追什么。 */
  ul.items { list-style:none; }
  ul.items > li {
    display:flex; gap:10px; align-items:center;
    padding:9px 2px; border-bottom:1px solid var(--line-soft);
  }
  ul.items > li:first-child { border-top:1px solid var(--line-soft); }

  .it-dot {
    flex-shrink:0; width:7px; height:7px; border-radius:50%;
    background:var(--line);
  }
  .it-dot.watching { background:var(--orange); }
  .it-dot.done { background:var(--text-sec); }

  .it-main {
    flex:1; min-width:0;
    display:flex; align-items:baseline; gap:9px; flex-wrap:wrap;
    cursor:pointer; text-align:left;
    background:none; border:none; padding:0; font:inherit; color:inherit;
  }
  .it-title {
    font-family:var(--serif); font-weight:900; font-size:16px;
    line-height:1.55; letter-spacing:-.3px; word-break:break-word;
  }
  .it-main:hover .it-title { color:var(--orange); }
  .it-meta {
    font-family:var(--mono); font-size:11px; letter-spacing:.5px;
    color:var(--text-sec); line-height:1.6; word-break:break-word;
  }
  .it-meta .dot { margin:0 5px; opacity:.5; }
  .stars { color:var(--orange); letter-spacing:1px; }

  .it-tail { flex-shrink:0; display:flex; align-items:center; gap:8px; }

  /* 豆瓣跳转：行尾唯一的操作。手机上要好按，给足点击区域 */
  .db-tag {
    font-family:var(--mono); font-size:11px; letter-spacing:.5px;
    color:var(--text-sec); text-decoration:none;
    border:1.5px solid var(--line); border-radius:99px;
    padding:4px 11px; line-height:1.5; white-space:nowrap;
    transition:background .15s, color .15s, border-color .15s;
  }
  .db-tag:hover, .db-tag:active {
    background:var(--orange); border-color:var(--orange); color:#fff;
  }
  /* 没存链接、只能按标题去搜的，虚线框区分一下 */
  .db-tag.guess { border-style:dashed; opacity:.72; }

  .bar {
    display:flex; justify-content:space-between; align-items:center;
    margin-top:22px;
    font-family:var(--mono); font-size:11px; letter-spacing:1.2px;
    color:var(--text-sec);
  }

  /* ===== 条目详情 ===== */
  .detail h2 {
    font-family:var(--serif); font-weight:900; font-size:27px;
    line-height:1.4; letter-spacing:-.8px; word-break:break-word;
  }
  .detail .sub {
    font-family:var(--mono); font-size:11.5px; letter-spacing:.8px;
    color:var(--text-sec); margin-top:7px; line-height:1.7;
  }
  dl.info {
    display:grid; grid-template-columns:64px 1fr; gap:5px 14px;
    margin:20px 0 4px; font-size:14px;
  }
  dl.info dt {
    font-family:var(--mono); font-size:10px; letter-spacing:1px;
    text-transform:uppercase; color:var(--text-sec); padding-top:4px;
  }
  dl.info dd { word-break:break-word; line-height:1.6; }

  .seg {
    display:flex; align-items:baseline; justify-content:space-between;
    gap:10px; margin:30px 0 14px; padding-top:18px;
    border-top:1px solid var(--line-soft);
  }
  .note-body {
    font-size:16px; line-height:1.8; white-space:pre-wrap;
    word-break:break-word;
    border-left:2px solid var(--orange); padding-left:14px;
  }
  .note-none { font-size:14px; color:var(--text-sec); line-height:1.7; }

  /* ===== 打卡日历（单条目，方格） ===== */
  .cal-top {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:12px;
  }
  .cal-title { font-family:var(--mono); font-size:12px; letter-spacing:1.5px; }
  .cal-nav { display:flex; gap:6px; }
  .cal-nav button {
    width:30px; height:30px; border-radius:9px;
    background:var(--cream-deep); border:none; cursor:pointer;
    font-family:var(--mono); font-size:13px; color:var(--text-sec);
  }
  .cal-nav button:hover { background:#DCD5C5; }

  .cal-week {
    display:grid; grid-template-columns:repeat(7, 1fr);
    gap:5px; margin-bottom:5px;
  }
  .cal-week span {
    text-align:center; font-family:var(--mono); font-size:10px;
    letter-spacing:.5px; color:var(--text-sec);
  }
  .ccal { display:grid; grid-template-columns:repeat(7, 1fr); gap:5px; }
  .ccal .cell {
    aspect-ratio:1; border-radius:8px;
    background:var(--cream-deep); border:1.5px solid transparent;
    font-family:var(--mono); font-size:13px; color:var(--text-sec);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; padding:0;
    transition:background .12s, color .12s;
  }
  .ccal .cell:hover { background:#DCD5C5; }
  .ccal .cell.pad { background:transparent; cursor:default; }
  .ccal .cell.pad:hover { background:transparent; }
  .ccal .cell.hit { background:var(--orange); color:#fff; }
  .ccal .cell.today { border-color:var(--ink); color:var(--text); }
  .ccal .cell.hit.today { border-color:var(--ink); color:#fff; }
  .ccal .cell.anchor { border-color:var(--orange); }
  .ccal .cell.future { opacity:.35; cursor:default; }
  .ccal .cell.future:hover { background:var(--cream-deep); }

  .cal-foot {
    margin-top:12px; font-family:var(--mono); font-size:11px;
    letter-spacing:.8px; color:var(--text-sec); line-height:1.7;
  }
  .cal-tools { display:flex; gap:8px; align-items:center; margin-top:12px; flex-wrap:wrap; }

  /* ===== 月历（全局，格子里放标题） ===== */
  .mcal-head {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px;
  }
  .mcal-title { font-family:var(--serif); font-weight:900; font-size:22px; letter-spacing:-.5px; }
  .navbtn {
    width:34px; height:34px; flex-shrink:0;
    background:var(--cream-deep); border:none; border-radius:10px;
    color:var(--text-sec); font-family:var(--mono); font-size:15px;
    cursor:pointer; transition:background .15s, color .15s;
  }
  .navbtn:hover { background:var(--orange); color:#fff; }

  .dow {
    display:grid; grid-template-columns:repeat(7,1fr); gap:4px;
    margin-bottom:6px;
  }
  .dow span {
    text-align:center;
    font-family:var(--mono); font-size:10px; letter-spacing:1px;
    color:var(--text-sec);
  }
  .mcal { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .mcal .cell {
    min-height:64px; padding:6px 5px;
    background:var(--cream-deep); border:1.5px solid transparent;
    border-radius:10px; cursor:pointer; overflow:hidden;
    transition:border-color .15s;
    text-align:left;
  }
  .mcal .cell.pad { background:transparent; cursor:default; }
  .mcal .cell.today .dnum { color:var(--orange); }
  .mcal .cell.sel { border-color:var(--orange); }
  .mcal .cell.empty0 { cursor:default; }
  .dnum {
    font-family:var(--mono); font-size:11px; color:var(--text-sec);
    display:block; margin-bottom:3px;
  }
  .mini {
    font-family:var(--serif); font-size:9.5px; line-height:1.35;
    color:var(--ink);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .dots { display:flex; gap:3px; flex-wrap:wrap; }
  .dots i {
    width:5px; height:5px; border-radius:50%;
    background:var(--orange); display:block;
  }
  .day-panel { margin-top:24px; }
  .day-panel .overline { margin-bottom:12px; display:block; }

  /* 手机上格子太窄，标题换成圆点 */
  @media (max-width:520px) {
    .mini { display:none; }
    .mcal .cell { min-height:52px; }
  }
  @media (min-width:521px) { .dots { display:none; } }

  /* ===== 表单 ===== */
  .form {
    display:none;
    background:var(--cream-deep);
    border-radius:var(--radius-lg);
    padding:22px 20px; margin-bottom:24px;
  }
  .form.on { display:block; }
  .form .frow { margin-bottom:14px; }
  .form label, .lab {
    display:block; margin-bottom:7px;
    font-family:var(--mono); font-size:10.5px; letter-spacing:1.2px;
    text-transform:uppercase; color:var(--text-sec);
  }
  .form .field { width:100%; background:var(--cream); }
  .form textarea.field { resize:vertical; min-height:64px; font-family:var(--serif); }
  .inline { display:flex; gap:9px; }
  .inline .field { flex:1; }

  .starpick { display:flex; gap:6px; align-items:center; }
  .starpick button {
    background:none; border:none; cursor:pointer;
    font-family:var(--mono); font-size:20px; line-height:1;
    color:var(--line); padding:0;
    transition:color .12s;
  }
  .starpick button.lit { color:var(--orange); }
  .starpick .clr { font-size:10px; letter-spacing:1px; color:var(--text-sec); margin-left:6px; }

  .hint-note { font-size:12.5px; line-height:1.65; color:var(--text-sec); margin-top:9px; }

  /* 豆瓣候选 */
  .sugg { margin-top:12px; }
  .sugg-list { list-style:none; }
  .sugg-list li {
    padding:10px 11px; border-radius:10px; cursor:pointer;
    background:var(--cream); margin-bottom:2px;
    transition:background .15s;
  }
  .sugg-list li:hover { background:#E9E2D2; }
  .sugg-t { font-size:14px; font-weight:900; line-height:1.45; }
  .sugg-s { font-family:var(--mono); font-size:10px; letter-spacing:.5px; color:var(--text-sec); margin-top:2px; }

  .form-acts { display:flex; gap:10px; margin-top:20px; }

  /* ===== 备份 ===== */
  .backup { margin-top:46px; padding-top:22px; border-top:1px solid var(--line-soft); }
  .backup-head { display:flex; align-items:baseline; gap:10px; margin-bottom:12px; }
  .backup-note { margin-top:12px; font-size:13px; line-height:1.65; color:var(--text-sec); }

  @media (max-width:480px) {
    .wrap { padding-left:22px; padding-right:22px; }
    .title-display { font-size:34px; }
    .stats { grid-template-columns:repeat(2, 1fr); }
    dl.info { grid-template-columns:56px 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="head-top">
      <a class="back" href="../../" aria-label="返回工作台">←</a>
      <div class="overline">Shelf</div>
    </div>
    <h1 class="title-display">收藏<span class="orange">夹</span></h1>
  </header>

  <div class="tabs" id="tabs">
    <button class="tab on" data-view="list" type="button">清单</button>
    <button class="tab" data-view="cal" type="button">日历</button>
  </div>

  <!-- ============ 清单视图 ============ -->
  <section class="view on" id="v-list">

    <div class="addbar">
      <button class="btn" id="add-open" type="button">＋ 记一条</button>
    </div>

    <!-- 表单：新增和编辑共用 -->
    <div class="form" id="form">
      <div class="frow">
        <label for="f-title">标题</label>
        <div class="inline">
          <input type="text" class="field" id="f-title" placeholder="片名 / 书名 / 节目名" autocomplete="off">
          <button class="btn-ghost" id="f-fetch" type="button">找豆瓣</button>
        </div>
        <div class="sugg" id="sugg" style="display:none"></div>
      </div>

      <div class="frow">
        <label>分类</label>
        <div class="chips" id="f-cats"></div>
      </div>

      <div class="frow inline">
        <div style="flex:1">
          <label for="f-date">日期</label>
          <input type="date" class="field" id="f-date">
        </div>
        <div style="flex:1">
          <label for="f-date2">到（可留空）</label>
          <input type="date" class="field" id="f-date2">
        </div>
      </div>
      <div class="frow" id="f-dates-note" style="margin-top:-6px"></div>

      <div class="frow">
        <label>状态</label>
        <div class="chips" id="f-status"></div>
      </div>

      <div class="frow">
        <label>评分</label>
        <div class="starpick" id="f-stars">
          <button type="button" data-v="1">●</button>
          <button type="button" data-v="2">●</button>
          <button type="button" data-v="3">●</button>
          <button type="button" data-v="4">●</button>
          <button type="button" data-v="5">●</button>
          <span class="clr"><button class="iconbtn" id="f-star-clr" type="button">清除</button></span>
        </div>
      </div>

      <div class="frow">
        <label for="f-note">评价</label>
        <textarea class="field" id="f-note" placeholder="看完想说的，或者不写"></textarea>
      </div>

      <div class="frow">
        <label for="f-link">豆瓣链接</label>
        <input type="url" class="field" id="f-link" placeholder="https://movie.douban.com/subject/..." autocomplete="off">
        <div class="row" style="margin-top:9px">
          <button class="btn-ghost btn-sm" id="f-douban" type="button">去豆瓣搜</button>
          <button class="btn-ghost btn-sm" id="f-link-clr" type="button">清空</button>
        </div>
        <p class="hint-note">
          「找豆瓣」会试着自动带回链接，通了就一步到位。豆瓣不对网页开放、要借第三方中转，
          不通就点「去豆瓣搜」，把条目页地址复制粘贴进来，一样能点击跳转。
        </p>
      </div>

      <div class="form-acts">
        <button class="btn" id="f-save" type="button">保存</button>
        <button class="btn-ghost" id="f-cancel" type="button">取消</button>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="chips" id="filter"></div>
    <input type="search" class="field" id="search" placeholder="搜标题、评价" autocomplete="off">

    <ul class="items" id="list"></ul>
    <div class="empty" id="empty">还没有记录<br>点上面「记一条」开始</div>

    <div class="bar">
      <span id="count"></span>
      <button class="iconbtn" id="mng-cat" type="button" style="font-size:11px;letter-spacing:1.2px;opacity:.7">管理分类</button>
    </div>

    <section class="backup">
      <div class="backup-head">
        <span class="card-mini-icon" style="font-size:17px">⇄</span>
        <span class="overline sec">Backup</span>
      </div>
      <div class="row">
        <button class="btn-ghost" id="export" type="button">导出备份</button>
        <button class="btn-ghost" id="import" type="button">导入备份</button>
      </div>
      <p class="backup-note">
        数据只在这台设备的浏览器里。清除浏览器数据、删掉这个应用、换手机都会丢，
        建议定期导出一份存网盘。
      </p>
    </section>
  </section>

  <!-- ============ 日历视图 ============ -->
  <section class="view" id="v-cal">
    <div class="mcal-head">
      <div class="mcal-title" id="cal-title"></div>
      <div class="row" style="gap:8px">
        <button class="navbtn" id="cal-prev" type="button">‹</button>
        <button class="navbtn" id="cal-today" type="button" style="width:auto;padding:0 12px;font-size:11px;letter-spacing:1px">今天</button>
        <button class="navbtn" id="cal-next" type="button">›</button>
      </div>
    </div>
    <div class="dow"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
    <div class="mcal" id="grid"></div>

    <div class="day-panel" id="day-panel"></div>
  </section>

  <!-- ============ 条目详情 ============ -->
  <section class="view" id="v-item">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:20px">
      <span class="overline sec">Entry</span>
      <button class="linkbtn" id="item-back" type="button">← 回清单</button>
    </div>
    <div class="detail" id="detail"></div>
  </section>

</div>

<script src="../../storage.js"></script>
<script src="./app.js"></script>
</body>
</html>
