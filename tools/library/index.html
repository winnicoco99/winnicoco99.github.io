<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>藏书馆</title>
<meta name="theme-color" content="#EFEAE0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="../../icons/icon-180.png">

<link rel="stylesheet" href="../../theme.css">
<style>
  header { margin-bottom:30px; }
  .head-top { display:flex; align-items:center; gap:14px; margin-bottom:24px; }
  .head-top .overline { color:var(--text-sec); }

  /* ===== 通用小件 ===== */
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .btn-ghost {
    font-family:var(--serif); font-weight:900; font-size:14px;
    color:var(--text); background:transparent;
    border:1.5px solid var(--line); border-radius:var(--radius);
    padding:10px 18px; cursor:pointer;
    transition:border-color .15s, color .15s;
  }
  .btn-ghost:hover { border-color:var(--orange); color:var(--orange); }
  .btn-ghost:disabled { opacity:.4; cursor:default; }
  .btn-sm { padding:7px 13px; font-size:13px; }

  .chip {
    font-family:var(--serif); font-size:14px;
    background:var(--cream-deep); color:var(--text-sec);
    border:1px solid transparent; border-radius:99px;
    padding:7px 15px; cursor:pointer;
    transition:background .15s, color .15s;
  }
  .chip:hover { background:#DCD5C5; }
  .chip.on { background:var(--ink); color:var(--cream); }
  .chip.ghost { background:transparent; border:1px dashed var(--line); }

  .linkbtn {
    background:none; border:none; cursor:pointer;
    font-family:var(--mono); font-size:11px; letter-spacing:1.2px;
    color:var(--text-sec); transition:color .15s;
  }
  .linkbtn:hover { color:var(--orange); }

  .empty {
    background:var(--cream-deep); border-radius:var(--radius-lg);
    padding:52px 30px; text-align:center;
    color:var(--text-sec); font-size:15px; line-height:1.8;
  }

  /* ===== 顶部主操作 ===== */
  .actions { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .actions .btn { flex:1; min-width:130px; }

  .hint {
    font-family:var(--mono); font-size:11px; letter-spacing:.8px;
    color:var(--text-sec); margin-bottom:26px;
  }

  /* ===== 统计条 ===== */
  .stats {
    display:grid; grid-template-columns:repeat(4, 1fr);
    gap:1px; background:var(--line-soft);
    border-radius:var(--radius); overflow:hidden;
    margin-bottom:26px;
  }
  .stat { background:var(--cream-deep); padding:15px 8px; text-align:center; }
  .stat b {
    display:block; font-family:var(--serif); font-weight:900;
    font-size:25px; line-height:1.25; letter-spacing:-.5px;
  }
  .stat span {
    font-family:var(--mono); font-size:10px; letter-spacing:1.2px;
    text-transform:uppercase; color:var(--text-sec);
  }
  .stat.today b { color:var(--orange); }

  /* ===== 筛选 + 搜索 ===== */
  .filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  #search { width:100%; margin-bottom:22px; }

  /* ===== 书列表 =====
     没有封面，一行就压到一行文字的高度（~45px），
     几百本书能快速滚动扫读，一屏看十几本。
     书名和作者/出版社挤在同一行，靠字号和颜色分层次。 */
  ul.books { list-style:none; }
  ul.books > li {
    display:flex; gap:10px; align-items:center;
    padding:8px 2px; border-bottom:1px solid var(--line-soft);
  }
  ul.books > li:first-child { border-top:1px solid var(--line-soft); }

  /* 状态点前置：橙色=在看，一眼扫到手上正读的书 */
  .bk-dot {
    flex-shrink:0; width:7px; height:7px; border-radius:50%;
    background:var(--line);
  }
  .bk-dot.reading { background:var(--orange); }
  .bk-dot.done { background:var(--text-sec); }

  .bk-main {
    flex:1; min-width:0;
    display:flex; align-items:baseline; gap:9px;
    /* 一行放不下时才换行，多数情况下是一行 */
    flex-wrap:wrap;
  }
  .bk-title {
    font-family:var(--serif); font-weight:900; font-size:16px;
    line-height:1.55; letter-spacing:-.3px; word-break:break-word;
  }
  .bk-meta {
    font-size:12px; color:var(--text-sec);
    line-height:1.55; word-break:break-word;
  }
  .bk-meta .dot { margin:0 5px; opacity:.5; }

  .bk-tail {
    flex-shrink:0; display:flex; align-items:center; gap:8px;
  }
  /* 打卡按钮：今天打过就变实心，一眼知道今天读没读 */
  .tick {
    font-family:var(--mono); font-size:11px; letter-spacing:.5px;
    background:transparent; color:var(--text-sec);
    border:1.5px solid var(--line); border-radius:99px;
    padding:4px 10px; cursor:pointer; white-space:nowrap;
    transition:background .15s, color .15s, border-color .15s;
  }
  .tick:hover { border-color:var(--orange); color:var(--orange); }
  .tick.on {
    background:var(--orange); border-color:var(--orange); color:#fff;
  }
  .bk-days {
    font-family:var(--mono); font-size:10px; letter-spacing:1px;
    color:var(--text-sec); white-space:nowrap;
  }

  /* ===== 详情面板（点书名展开） ===== */
  .detail { display:none; }
  .detail.on { display:block; }
  .detail h2 {
    font-family:var(--serif); font-weight:900; font-size:26px;
    line-height:1.4; letter-spacing:-.8px; word-break:break-word;
  }
  .detail .sub { font-size:14px; color:var(--text-sec); margin-top:5px; line-height:1.6; }

  dl.info {
    display:grid; grid-template-columns:64px 1fr; gap:5px 14px;
    margin:18px 0 4px; font-size:14px;
  }
  dl.info dt {
    font-family:var(--mono); font-size:10px; letter-spacing:1px;
    text-transform:uppercase; color:var(--text-sec); padding-top:4px;
  }
  dl.info dd { word-break:break-word; }

  /* 分段标题 */
  .seg {
    display:flex; align-items:baseline; justify-content:space-between;
    margin:32px 0 14px; padding-top:18px;
    border-top:1px solid var(--line-soft);
  }

  /* ===== 每本书自己的打卡日历 ===== */
  .cal-top {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:12px;
  }
  .cal-title { font-family:var(--mono); font-size:12px; letter-spacing:1.5px; }
  .cal-nav { display:flex; gap:6px; }
  .cal-nav button {
    width:30px; height:30px; border-radius:9px;
    background:var(--cream-deep); border:none; cursor:pointer;
    font-family:var(--mono); font-size:13px; color:var(--text-sec);
  }
  .cal-nav button:hover { background:#DCD5C5; }

  .cal-week {
    display:grid; grid-template-columns:repeat(7, 1fr);
    gap:5px; margin-bottom:5px;
  }
  .cal-week span {
    text-align:center; font-family:var(--mono); font-size:10px;
    letter-spacing:.5px; color:var(--text-sec);
  }
  .cal-grid { display:grid; grid-template-columns:repeat(7, 1fr); gap:5px; }
  .cal-grid .cell {
    aspect-ratio:1; border-radius:8px;
    background:var(--cream-deep); border:1.5px solid transparent;
    font-family:var(--mono); font-size:13px; color:var(--text-sec);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; padding:0;
    transition:background .12s, color .12s;
  }
  .cal-grid .cell:hover { background:#DCD5C5; }
  .cal-grid .cell.pad { background:transparent; cursor:default; }
  .cal-grid .cell.pad:hover { background:transparent; }
  /* 打过卡的日子填橙色 —— 一个月扫一眼就知道读得勤不勤 */
  .cal-grid .cell.hit { background:var(--orange); color:#fff; }
  .cal-grid .cell.today { border-color:var(--ink); color:var(--text); }
  .cal-grid .cell.hit.today { border-color:var(--ink); color:#fff; }
  .cal-grid .cell.future { opacity:.35; cursor:default; }
  .cal-grid .cell.future:hover { background:var(--cream-deep); }

  .cal-foot {
    margin-top:12px; font-family:var(--mono); font-size:11px;
    letter-spacing:.8px; color:var(--text-sec); line-height:1.7;
  }

  /* ===== 摘录 / 感想 ===== */
  ul.notes { list-style:none; }
  ul.notes > li {
    padding:15px 0; border-bottom:1px solid var(--line-soft);
  }
  ul.notes > li:first-child { border-top:1px solid var(--line-soft); }

  /* 摘录正文用左边一道橙线标出来，像书里划的重点 */
  .ex-text {
    font-size:16px; line-height:1.75; white-space:pre-wrap;
    word-break:break-word;
    border-left:2px solid var(--orange); padding-left:14px;
  }
  .th-text {
    font-size:16px; line-height:1.75; white-space:pre-wrap;
    word-break:break-word;
  }
  .ex-mine {
    margin-top:9px; padding-left:16px;
    font-size:14px; line-height:1.7; color:var(--text-sec);
    white-space:pre-wrap; word-break:break-word;
  }
  .note-foot {
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; margin-top:9px;
  }
  .note-when {
    font-family:var(--mono); font-size:10px; letter-spacing:1px;
    color:var(--text-sec);
  }
  .note-acts { display:flex; gap:4px; }
  .iconbtn {
    background:none; border:none; cursor:pointer;
    font-family:var(--mono); font-size:15px; color:var(--text-sec);
    opacity:.55; padding:0 5px; line-height:1.4;
    transition:opacity .15s, color .15s;
  }
  .iconbtn:hover { opacity:1; color:var(--orange); }

  /* ===== 表单 ===== */
  .panel { display:none; }
  .panel.on { display:block; }
  .form-grid { display:grid; gap:12px; }
  .form-grid .field { width:100%; }
  textarea.field {
    resize:vertical; min-height:96px; line-height:1.7;
    font-family:var(--serif);
  }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .lab {
    font-family:var(--mono); font-size:10px; letter-spacing:1.2px;
    text-transform:uppercase; color:var(--text-sec);
    display:block; margin-bottom:7px;
  }

  /* ===== 扫码区 ===== */
  #reader {
    border-radius:var(--radius); overflow:hidden;
    background:var(--cream-deep); margin-bottom:12px;
  }
  #reader:empty { display:none; }
  #reader video { width:100%!important; height:auto!important; display:block; }

  .scan-msg {
    font-family:var(--mono); font-size:11px; letter-spacing:.8px;
    color:var(--text-sec); line-height:1.7; white-space:pre-wrap;
    margin-bottom:12px;
  }
  /* 查重命中：这是整个工具最重要的一句话，给足重量 */
  .dupe {
    background:var(--orange); color:#fff;
    border-radius:var(--radius); padding:17px 19px; margin-bottom:14px;
  }
  .dupe b {
    font-family:var(--serif); font-weight:900; font-size:18px;
    line-height:1.45; display:block; margin-bottom:5px;
  }
  .dupe span { font-size:14px; line-height:1.65; opacity:.94; }

  /* 搜到的候选书 */
  ul.sugg { list-style:none; margin-bottom:12px; }
  ul.sugg > li {
    padding:11px 2px; border-bottom:1px solid var(--line-soft);
    cursor:pointer;
  }
  ul.sugg > li:hover { background:var(--cream-deep); }
  .sugg-t { font-family:var(--serif); font-weight:900; font-size:15px; line-height:1.45; }
  .sugg-s { font-size:12px; color:var(--text-sec); margin-top:2px; line-height:1.5; }

  /* ===== 备份 ===== */
  .backup { margin-top:48px; padding-top:22px; border-top:1px solid var(--line-soft); }
  .backup-head { display:flex; align-items:baseline; gap:10px; margin-bottom:12px; }
  .backup-note { margin-top:12px; font-size:13px; line-height:1.65; color:var(--text-sec); }

  @media (max-width:480px) {
    .wrap { padding-left:22px; padding-right:22px; }
    .title-display { font-size:34px; }
    .stats { grid-template-columns:repeat(2, 1fr); }
    .pair { grid-template-columns:1fr; }
    .actions .btn { min-width:0; }
    dl.info { grid-template-columns:56px 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="head-top">
      <a class="back" href="../../" aria-label="返回工作台">←</a>
      <div class="overline">Library</div>
    </div>
    <h1 class="title-display">藏书<span class="orange">馆</span></h1>
  </header>

  <!-- ========== 列表视图 ========== -->
  <section id="v-list">

    <div class="actions">
      <button class="btn" id="go-scan" type="button">扫码入库</button>
      <button class="btn-ghost" id="go-manual" type="button">手动登记</button>
    </div>
    <div class="hint">买书前先扫一下，重了会立刻提醒</div>

    <div class="stats" id="stats"></div>

    <div class="filters" id="filters"></div>
    <input type="search" class="field" id="search" placeholder="搜书名、作者、出版社" autocomplete="off">

    <ul class="books" id="books"></ul>
    <div class="empty" id="empty">书架还空着<br>扫一本书的条形码开始</div>

    <div class="row" style="justify-content:space-between;align-items:center;margin-top:22px">
      <span class="linkbtn" id="count" style="cursor:default"></span>
    </div>

    <section class="backup">
      <div class="backup-head">
        <span class="card-mini-icon" style="font-size:17px">⇄</span>
        <span class="overline sec">Backup</span>
      </div>
      <div class="row">
        <button class="btn-ghost" id="export" type="button">导出备份</button>
        <button class="btn-ghost" id="import" type="button">导入备份</button>
      </div>
      <p class="backup-note" id="quota">
        清除浏览器数据、删掉这个应用、或者换手机，本地数据都会丢。
        摘录和感想攒起来不容易，建议定期导出一份。
      </p>
    </section>

  </section>

  <!-- ========== 入库视图（扫码 / 手动 / 编辑 共用） ========== -->
  <section id="v-edit" class="panel">

    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:20px">
      <span class="overline sec" id="edit-mode">Add</span>
      <button class="linkbtn" id="edit-back" type="button">← 回书架</button>
    </div>

    <div id="scan-box">
      <div class="row" style="margin-bottom:12px">
        <button class="btn-ghost btn-sm" id="scan-start" type="button">开摄像头</button>
        <button class="btn-ghost btn-sm" id="scan-stop" type="button" disabled>停止</button>
      </div>
      <div id="reader"></div>
      <div class="scan-msg" id="scan-msg"></div>
    </div>

    <div id="dupe-box"></div>

    <div class="form-grid">
      <div>
        <label class="lab" for="f-isbn">ISBN（扫码自动填，也可手输后点查）</label>
        <div class="row" style="gap:8px">
          <input type="text" class="field" id="f-isbn" inputmode="numeric"
                 placeholder="13 位数字" style="flex:1">
          <button class="btn-ghost btn-sm" id="f-lookup" type="button">查书目</button>
        </div>
      </div>

      <div>
        <label class="lab" for="f-title">书名</label>
        <div class="row" style="gap:8px">
          <input type="text" class="field" id="f-title" placeholder="必填" style="flex:1">
          <button class="btn-ghost btn-sm" id="f-search" type="button">按名搜</button>
        </div>
      </div>

      <ul class="sugg" id="sugg"></ul>

      <div class="pair">
        <div>
          <label class="lab" for="f-author">作者</label>
          <input type="text" class="field" id="f-author">
        </div>
        <div>
          <label class="lab" for="f-translator">译者</label>
          <input type="text" class="field" id="f-translator">
        </div>
      </div>

      <div class="pair">
        <div>
          <label class="lab" for="f-publisher">出版社</label>
          <input type="text" class="field" id="f-publisher">
        </div>
        <div>
          <label class="lab" for="f-pubdate">出版时间</label>
          <input type="text" class="field" id="f-pubdate" placeholder="2026-07">
        </div>
      </div>

      <div class="pair">
        <div>
          <label class="lab" for="f-pages">页数</label>
          <input type="text" class="field" id="f-pages" inputmode="numeric">
        </div>
        <div>
          <label class="lab" for="f-bought">买入日期</label>
          <input type="date" class="field" id="f-bought">
        </div>
      </div>

      <div>
        <span class="lab">状态</span>
        <div class="row" id="f-status"></div>
      </div>

      <div>
        <label class="lab" for="f-note">备注（放在哪、谁送的、随便写）</label>
        <textarea class="field" id="f-note" style="min-height:72px"></textarea>
      </div>

      <div class="row" style="margin-top:6px">
        <button class="btn" id="f-save" type="button">存进书架</button>
        <button class="btn-ghost" id="f-cancel" type="button">取消</button>
      </div>
    </div>

  </section>

  <!-- ========== 单本书详情 ========== -->
  <section id="v-book" class="panel">

    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:20px">
      <span class="overline sec">Book</span>
      <button class="linkbtn" id="book-back" type="button">← 回书架</button>
    </div>

    <div class="detail on" id="detail"></div>

  </section>

</div>

<script src="vendor/html5-qrcode.min.js"></script>
<script src="../../storage.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
